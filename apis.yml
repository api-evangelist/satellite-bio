name: Satellite Bio
description: >-
  Satellite Bio is a biotechnology company developing off-the-shelf liver cell
  therapies to treat severe and life-threatening liver diseases. Its tissue
  therapeutics platform engineers functional hepatocytes designed to engraft and
  restore liver function, combining the biological power of liver cells with
  scalable manufacturing and distribution. The company is headquartered in
  Newton, Massachusetts and is backed by Lightspeed Venture Partners. Satellite
  Bio is a life-sciences company and does not currently publish a public
  developer platform, API, or technical integration surface.
